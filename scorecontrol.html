<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Scoreboard Control</title>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <style>
      body {
        background: #111;
        color: white;
        font-family: Arial;
        padding: 20px;
      }

      .container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
      }

      .section {
        margin-bottom: 25px;
        padding: 15px;
        background: #1c1c1c;
        border-radius: 10px;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 10px;
      }

      button {
        padding: 8px 14px;
        cursor: pointer;
        border: none;
        border-radius: 6px;
        background: #333;
        color: white;
      }

      button:hover {
        background: #555;
      }

      input {
        padding: 6px;
        border-radius: 5px;
        border: none;
      }

      h3 {
        margin: 0;
        margin-bottom: 5px;
      }
    </style>
  </head>

  <body>
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSy...",
        authDomain: "scoreboard-basket-ea929.firebaseapp.com",
        databaseURL: "https://scoreboard-basket-ea929-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "scoreboard-basket-ea929",
        storageBucket: "scoreboard-basket-ea929.firebasestorage.app",
        messagingSenderId: "248063752824",
        appId: "1:248063752824:web:10eccbc425598daa748b8d",
      };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();

      let data = {};

      db.ref("scoreboard").on("value", (snap) => {
        if (snap.exists()) data = snap.val();
      });

      function save(obj) {
        db.ref("scoreboard").update(obj);
      }

      /* 🔥 JUDUL */
      function setMatchTitle(v) {
        save({ matchTitle: v });
      }

      /* TEAM */
      function setName(t, v) {
        save({ ["team" + t + "Name"]: v });
      }

      function setLogo(e, t) {
        let reader = new FileReader();
        reader.onload = () => {
          save({ ["logo" + t]: reader.result });
        };
        reader.readAsDataURL(e.target.files[0]);
      }

      function setColor(t, color) {
        save({ ["color" + t]: color });
      }

      function setTextColor(t, color) {
        save({ ["textColor" + t]: color });
      }

      /* 🔥 SCORE (UPDATE ADA MINUS) */
      function addScore(t, v) {
        let newScore = Math.max(0, (data["score" + t] || 0) + v);
        save({ ["score" + t]: newScore });
      }

      function resetScore() {
        save({ scoreA: 0, scoreB: 0 });
      }

      /* FOUL */
      function addFoul(t) {
        save({ ["foul" + t]: (data["foul" + t] || 0) + 1 });
      }

      function minusFoul(t) {
        save({ ["foul" + t]: Math.max(0, (data["foul" + t] || 0) - 1) });
      }

      function resetFoul() {
        save({ foulA: 0, foulB: 0 });
      }
    </script>

    <div class="container">
      <!-- LEFT -->
      <div>

        <div class="section">
          <h3>JUDUL</h3>
          <div class="row">
            <input placeholder="GROUP PHASE" oninput="setMatchTitle(this.value)" />
          </div>
        </div>

        <div class="section">
          <h3>TEAM</h3>
          <div class="row">
            <input placeholder="Team A" oninput="setName('A', this.value)" />
            <input type="color" onchange="setTextColor('A', this.value)" />
          </div>
          <div class="row">
            <input placeholder="Team B" oninput="setName('B', this.value)" />
            <input type="color" onchange="setTextColor('B', this.value)" />
          </div>
        </div>

        <div class="section">
          <h3>LOGO</h3>
          <div class="row">
            <input type="file" onchange="setLogo(event, 'A')" />
            <input type="file" onchange="setLogo(event, 'B')" />
          </div>
        </div>

        <div class="section">
          <h3>WARNA TEAM</h3>
          <div class="row">
            <input type="color" onchange="setColor('A', this.value)" />
            <input type="color" onchange="setColor('B', this.value)" />
          </div>
        </div>

      </div>

      <!-- RIGHT -->
      <div>

        <div class="section">
          <h3>SKOR</h3>

          <div class="row">
            Team A:
            <button onclick="addScore('A', -1)">-1</button>
            <button onclick="addScore('A', 1)">+1</button>
            <button onclick="addScore('A', 2)">+2</button>
            <button onclick="addScore('A', 3)">+3</button>
          </div>

          <div class="row">
            Team B:
            <button onclick="addScore('B', -1)">-1</button>
            <button onclick="addScore('B', 1)">+1</button>
            <button onclick="addScore('B', 2)">+2</button>
            <button onclick="addScore('B', 3)">+3</button>
          </div>

          <div class="row">
            <button onclick="resetScore()">RESET SCORE</button>
          </div>
        </div>

        <div class="section">
          <h3>FOUL</h3>
          <div class="row">
            A:
            <button onclick="addFoul('A')">+</button>
            <button onclick="minusFoul('A')">-</button>

            B:
            <button onclick="addFoul('B')">+</button>
            <button onclick="minusFoul('B')">-</button>
          </div>
        </div>

      </div>
    </div>
  </body>
</html>
