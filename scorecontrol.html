<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Scoreboard Control</title>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <style>
      body {
        background: #0f0f0f;
        color: white;
        font-family: Arial;
        padding: 20px;
      }

      .container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 25px;
      }

      .section {
        background: #1c1c1c;
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 20px;
      }

      h3 {
        margin: 0 0 10px 0;
      }

      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 8px;
      }

      button {
        padding: 8px 12px;
        border: none;
        border-radius: 6px;
        background: #333;
        color: white;
        cursor: pointer;
      }

      button:hover {
        background: #555;
      }

      input {
        padding: 6px;
        border-radius: 5px;
        border: none;
      }

      .big-btn {
        background: #ff3b30;
        margin-top: 18px;
        opacity: 0.95;
      }

      .big-btn:hover {
        background: #ff5c50;
      }

      .reset-row {
        margin-top: 15px;
      }

      /* 🔥 KHUSUS SEMUA TOMBOL RESET */
      .reset-btn {
        background: #ff3b30;
        color: white;
      }

      .reset-btn:hover {
        background: #ff5c50;
      }

      .start-btn {
        background: #34c759; /* 🟢 hijau */
        color: white;
      }

      .start-btn:hover {
        background: #4cd964;
      }
    </style>
  </head>

  <body>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSy...",
        authDomain: "scoreboard-basket-ea929.firebaseapp.com",
        databaseURL: "https://scoreboard-basket-ea929-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "scoreboard-basket-ea929",
        storageBucket: "scoreboard-basket-ea929.firebasestorage.app",
        messagingSenderId: "248063752824",
        appId: "1:248063752824:web:10eccbc425598daa748b8d",
      };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();

      let serverOffset = 0;
      firebase.database().ref(".info/serverTimeOffset").on("value", snap => {
        serverOffset = snap.val() || 0;
      });

      let data = {};
      db.ref("scoreboard").on("value", snap => {
        if (snap.exists()) data = snap.val();

          // warna text team
          const aColor = data.textColorA || "#ffffff";
          const bColor = data.textColorB || "#ffffff";

          // kalau nanti dipakai di display scoreboard
          window.teamAColor = aColor;
          window.teamBColor = bColor;

          // 🔥 WAJIB ADA
          handleShotEnd();
      });

      function handleShotEnd() {
        if (!data.shotStart) return;

          const now = Date.now() + serverOffset;

          const elapsed = (now - data.shotStart) / 1000;
          const duration = data.shotDuration || 24;

          const remaining = duration - elapsed;

        if (remaining <= 0) {
          save({
            shot: 24,
            shotStart: null,
            shotDuration: 24
          });
        }
      }

      // 🔥 TARUH DI PALING BAWAH SCRIPT
        setInterval(() => {
        handleShotEnd();
      }, 300);

      function save(obj) {
        db.ref("scoreboard").update(obj);
      }

      /* JUDUL */
      function setMatchTitle(v) {
        save({ matchTitle: v });
      }

      /* TEAM */
      function setName(t, v) {
        save({ ["team" + t + "Name"]: v });
      }

      function setLogo(e, t) {
        let reader = new FileReader();
        reader.onload = () => save({ ["logo" + t]: reader.result });
        reader.readAsDataURL(e.target.files[0]);
      }

      function setColor(t, color) {
        save({ ["color" + t]: color });
      }

      function setTextColor(t, color) {
        save({ ["textColor" + t]: color });
      }

      /* SCORE (ADA MINUS) */
      function addScore(t, v) {
        let newScore = Math.max(0, (data["score" + t] || 0) + v);
        save({ ["score" + t]: newScore });
      }

      function resetScore() {
        save({ scoreA: 0, scoreB: 0 });
      }

      /* FOUL */
      function addFoul(t) {
        save({ ["foul" + t]: (data["foul" + t] || 0) + 1 });
      }

      function minusFoul(t) {
        save({ ["foul" + t]: Math.max(0, (data["foul" + t] || 0) - 1) });
      }

      function resetFoul() {
        save({ foulA: 0, foulB: 0 });
      }

      /* TIMER */
      function setTime() {
        let total = (parseInt(min.value)||0)*60 + (parseInt(sec.value)||0);
        save({ time: total, defaultTime: total, gameStart: null });
      }

      function startGame() {
        const now = Date.now() + serverOffset;
        save({ gameStart: now, gameDuration: data.time || 0 });
      }

      function pauseGame() {
        if (!data.gameStart) return;
        const now = Date.now() + serverOffset;
        let elapsed = Math.ceil((now - data.gameStart)/1000);
        let remaining = Math.max(0,(data.gameDuration||0)-elapsed);
        save({ time: remaining, gameStart: null });
      }

      function resetTimer() {
        save({ time: data.defaultTime || 600, gameStart: null });
      }

      /* QUARTER */
      function nextQuarter() {
        save({ q: Math.min(4,(data.q||1)+1), gameStart:null });
      }

      function resetQuarter() {
        save({ q:1, gameStart:null });
      }

      /* SHOT CLOCK */
      function startShot() {
        if (!data.shotOn) return;

          const now = Date.now() + serverOffset;

        // kalau belum ada start → mulai dari durasi penuh
        if (!data.shotStart) {
          save({
            shotStart: now,
            shotDuration: data.shotDuration || 24
          });
        }
      }

      function pauseShot() {
        if (!data.shotStart) return;

          const now = Date.now() + serverOffset;

          const elapsed = (now - data.shotStart) / 1000;
          const remaining = Math.max(0, (data.shotDuration || 24) - elapsed);

          save({
            shotStart: null,
            shot: Math.floor(remaining) // simpan sisa saja
          });
      }

      function resetShot() {
        save({
          shot: 24,
          shotStart: null,
          shotDuration: 24
        });
      }

      function toggleShot() {
        const on = !data.shotOn;

        if (on) {
          save({
            shotOn: true,
            shot: data.shot || 24,
            shotStart: null,
            shotDuration: data.shot || 24
        });
        } else {
          save({
          shotOn: false,
          shot: 24,
          shotStart: null,
          shotDuration: 24
        });
      }
    }

      if (on) {
    // 🔥 hanya aktifkan, jangan start
        save({
            shotOn: true,
            shot: data.shot || 24,
            shotStart: null,
            shotDuration: data.shot || 24
        });
      } else {
        // 🔥 matikan sekalian reset
        save({
          shotOn: false,
          shot: 24,
          shotStart: null,
          shotDuration: 24
        });
      }
    }
    </script>

    <div class="container">

  <!-- LEFT -->
  <div>

    <div class="section">
      <h3>JUDUL</h3>
      <input placeholder="GROUP PHASE" oninput="setMatchTitle(this.value)" />
    </div>

    <div class="section">
      <h3>TEAM</h3>
      <div class="row">
        <input placeholder="Team A" oninput="setName('A', this.value)" />
        <input type="color" onchange="setTextColor('A', this.value)" />
      </div>
      <div class="row">
        <input placeholder="Team B" oninput="setName('B', this.value)" />
        <input type="color" onchange="setTextColor('B', this.value)" />
      </div>
    </div>

    <div class="section">
      <h3>LOGO</h3>
      <div class="row">
        <input type="file" onchange="setLogo(event,'A')" />
        <input type="file" onchange="setLogo(event,'B')" />
      </div>
    </div>

    <div class="section">
      <h3>WARNA TEAM</h3>
      <div class="row">
        <input type="color" onchange="setColor('A', this.value)" />
        <input type="color" onchange="setColor('B', this.value)" />
      </div>
    </div>

    <!-- 🔥 QUARTER DIPINDAH KE SINI -->
    <div class="section">
      <h3>QUARTER</h3>
      <div class="row">
        <button onclick="nextQuarter()">NEXT</button>
        <button class="reset-btn" onclick="resetQuarter()">RESET</button>
      </div>
    </div>

  </div>

  <!-- RIGHT -->
  <div>

    <div class="section">
      <h3>SKOR</h3>

      <div class="row">
        Team A:
        <button onclick="addScore('A',-1)">minus 1</button>
        <button onclick="addScore('A',1)">+1</button>
        <button onclick="addScore('A',2)">+2</button>
        <button onclick="addScore('A',3)">+3</button>
      </div>

      <div class="row">
        Team B:
        <button onclick="addScore('B',-1)">minus 1</button>
        <button onclick="addScore('B',1)">+1</button>
        <button onclick="addScore('B',2)">+2</button>
        <button onclick="addScore('B',3)">+3</button>
      </div>

      <!-- 🔥 dipisah & dikasih jarak -->
      <div class="row reset-row">
        <button class="big-btn reset-btn" onclick="resetScore()">RESET SCORE</button>
      </div>
    </div>

    <div class="section">
      <h3>FOUL</h3>

      <div class="row">
        Team A:
        <button onclick="addFoul('A')">plus</button>
        <button onclick="minusFoul('A')">minus</button>

        Team B:
        <button onclick="addFoul('B')">plus</button>
        <button onclick="minusFoul('B')">minus</button>
      </div>

      <!-- 🔥 dipisah & dikasih jarak -->
      <div class="row reset-row">
        <button class="big-btn reset-btn" onclick="resetFoul()">RESET FOUL</button>
      </div>
    </div>

    <div class="section">
      <h3>TIMER</h3>
      <div class="row">
        <input id="min" placeholder="Min" />
        <input id="sec" placeholder="Sec" />
        <button onclick="setTime()">SET</button>
      </div>

      <div class="row">
        <button class="start-btn" onclick="startGame()">START</button>
        <button onclick="pauseGame()">PAUSE</button>
        <button class="reset-btn" onclick="resetTimer()">RESET</button>
      </div>
    </div>

    <!-- 🔥 SHOT CLOCK TETAP DI KANAN -->
    <div class="section">
      <h3>SHOT CLOCK</h3>
      <div class="row">
        <button class="start-btn" onclick="startShot()">START</button>
        <button onclick="pauseShot()">PAUSE</button>
        <button class="reset-btn" onclick="resetShot()">RESET</button>
        <button onclick="toggleShot()">ON/OFF</button>
      </div>
    </div>

  </div>

</div>

  </body>
</html>
