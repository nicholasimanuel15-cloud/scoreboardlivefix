<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Scoreboard Display</title>

    <!-- 🔥 FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <style>
      body {
        margin: 0;
        background: transparent;
        font-family: "Arial Black", Arial, sans-serif;
      }

      :root {
        --teamA: #c8102e;
        --teamB: #1d428a;
      }

      .scoreboard {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: stretch;

        background: rgba(0, 0, 0, 0.9);
        border-radius: 10px;
        overflow: hidden;

        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      /* 🔥 MATCH TITLE */
      .matchTitle {
        background: #000;
        color: #b0b0b0; /* abu-abu */

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 10px 16px;
        font-size: 13px;
        font-weight: bold;
        letter-spacing: 1px;

        border-right: 2px solid rgba(255,255,255,0.1);

        text-align: center;
        line-height: 1.1;
        min-width: 110px;
      }

      .team {
        padding: 10px 16px;
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-width: 200px;
      }

      .teamTop {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
      }

      .teamA .teamTop {
        justify-content: flex-start;
      }

      .teamB .teamTop {
        justify-content: flex-end;
      }

      .team img {
        width: 40px;
        height: 40px;
        object-fit: contain;
      }

      .team span {
        font-size: 18px;
        font-weight: bold;
        letter-spacing: 1px;
      }

      .foulTeam {
        margin-top: 4px;
        font-size: 11px;
        opacity: 0.8;
      }

      .teamA .foulTeam {
        text-align: left;
      }

      .teamB .foulTeam {
        text-align: right;
      }

      .teamA {
        background: linear-gradient(135deg, var(--teamA), #000);
      }

      .teamB {
        background: linear-gradient(135deg, #000, var(--teamB));
      }

      .score {
        background: #111;
        color: white;
        font-size: 52px;
        font-weight: 900;
        text-align: center;

        padding: 10px 20px;
        min-width: 80px;

        border-left: 2px solid rgba(255, 255, 255, 0.1);
        border-right: 2px solid rgba(255, 255, 255, 0.1);
      }

      .center {
        background: #000;
        color: #fff;

        display: flex;
        flex-direction: column;
        justify-content: center;
        text-align: center;

        padding: 6px 16px;

        border-left: 2px solid rgba(255, 255, 255, 0.1);
        border-right: 2px solid rgba(255, 255, 255, 0.1);
      }

      #timer {
        font-size: 30px;
        font-weight: 900;

        color: #FFD700; /* emas */
      }

      .quarter {
        font-size: 11px;
        margin-top: 2px;
        opacity: 0.7;
        letter-spacing: 1px;
      }

      .shotclock {
        background: #ff3b30;
        color: white;

        font-size: 30px;
        font-weight: bold;

        min-width: 55px;
        padding: 10px;

        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>

  <body>
    <div class="scoreboard">

      <!-- 🔥 MATCH TITLE -->
      <div class="matchTitle" id="matchTitle">
        GROUP<br>PHASE
      </div>

      <!-- 🔴 TEAM A -->
      <div class="team teamA">
        <div class="teamTop">
          <img id="logoA" />
          <span id="teamAName">TEAM A</span>
        </div>
        <div class="foulTeam">
          FOUL <span id="foulA">0</span>
        </div>
      </div>

      <!-- 🔢 SCORE A -->
      <div class="score" id="scoreA">0</div>

      <!-- ⏱ CENTER -->
      <div class="center">
        <div id="timer">10:00</div>
        <div class="quarter" id="quarter">Q1</div>
      </div>

      <!-- 🔢 SCORE B -->
      <div class="score" id="scoreB">0</div>

      <!-- 🔵 TEAM B -->
      <div class="team teamB">
        <div class="teamTop">
          <span id="teamBName">TEAM B</span>
          <img id="logoB" />
        </div>
        <div class="foulTeam">
          FOUL <span id="foulB">0</span>
        </div>
      </div>

      <!-- ⏱ SHOT CLOCK -->
      <div class="shotclock" id="shotclock">24</div>
    </div>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSy...",
        authDomain: "scoreboard-basket-ea929.firebaseapp.com",
        databaseURL: "https://scoreboard-basket-ea929-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "scoreboard-basket-ea929",
        storageBucket: "scoreboard-basket-ea929.firebasestorage.app",
        messagingSenderId: "248063752824",
        appId: "1:248063752824:web:10eccbc425598daa748b8d",
      };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();

      let currentData = {};

      function formatTime(t) {
        let m = Math.floor(t / 60);
        let s = t % 60;
        return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
      }

      db.ref("scoreboard").on("value", (snapshot) => {
        currentData = snapshot.val() || {};

        // 🔥 AUTO 2 BARIS
        let title = currentData.matchTitle || "GROUP PHASE";
        matchTitle.innerHTML = title.replace(" ", "<br>");

        scoreA.innerText = currentData.scoreA || 0;
        scoreB.innerText = currentData.scoreB || 0;

        foulA.innerText = currentData.foulA || 0;
        foulB.innerText = currentData.foulB || 0;

        quarter.innerText = "Q" + (currentData.q || 1);

        teamAName.innerText = currentData.teamAName || "TEAM A";
        teamBName.innerText = currentData.teamBName || "TEAM B";

        if (currentData.logoA) logoA.src = currentData.logoA;
        if (currentData.logoB) logoB.src = currentData.logoB;

        if (currentData.colorA)
          document.documentElement.style.setProperty("--teamA", currentData.colorA);

        if (currentData.colorB)
          document.documentElement.style.setProperty("--teamB", currentData.colorB);

        teamAName.style.color = currentData.textColorA || "#ffffff";
        teamBName.style.color = currentData.textColorB || "#ffffff";
      });

      setInterval(() => {
        if (currentData.gameStart) {
          const now = Date.now();
          const elapsed = Math.floor((now - currentData.gameStart) / 1000);
          const remaining = Math.max(0, (currentData.gameDuration || 0) - elapsed);
          timer.innerText = formatTime(remaining);
        } else {
          timer.innerText = formatTime(currentData.time || 0);
        }

        if (currentData.shotStart && currentData.shotOn) {
          const now = Date.now();
          const elapsed = Math.floor((now - currentData.shotStart) / 1000);
          const remaining = Math.max(0, (currentData.shotDuration || 24) - elapsed);

          shotclock.innerText = remaining;
          shotclock.style.display = "flex";
        } else {
          shotclock.innerText = currentData.shot || 24;
          shotclock.style.display = currentData.shotOn ? "flex" : "none";
        }
      }, 200);
    </script>
  </body>
</html>
