<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Scoreboard Display</title>

    <!-- 🔥 FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <style>
      body {
        margin: 0;
        background: transparent;
        font-family: "Arial Black", Arial, sans-serif;
      }

      :root {
        --teamA: #c8102e;
        --teamB: #1d428a;
      }

      /* 🔥 MAIN */
      .scoreboard {
        position: absolute;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;

        background: rgba(10, 10, 10, 0.95);
        border-radius: 14px;
        overflow: visible;

        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.9);
        border: 1px solid rgba(255,255,255,0.08);
      }

      /* 🔥 TEAM */
      .team {
        width: 200px;
        padding: 10px 14px;
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .teamA {
        background: linear-gradient(135deg, var(--teamA), #000);
      }

      .teamB {
        background: linear-gradient(135deg, #000, var(--teamB));
      }

      .teamTop {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .teamA .teamTop {
        justify-content: flex-start;
      }

      .teamB .teamTop {
        justify-content: flex-end;
      }

      .team img {
        width: 26px;
        height: 26px;
      }

      .teamName {
        font-size: 14px;
        letter-spacing: 1px;
      }

      /* 🔥 FOUL */
      .foulTeam {
        margin-top: 6px;
        font-size: 11px;
        opacity: 0.8;
        border-top: 1px solid rgba(255,255,255,0.2);
        padding-top: 3px;
      }

      .teamA .foulTeam {
        text-align: left;
      }

      .teamB .foulTeam {
        text-align: right;
      }

      /* 🔥 SCORE */
      .scoreBox {
        display: flex;
        align-items: center;
        background: #000;
      }

      .score {
        font-size: 64px;
        font-weight: 900;
        padding: 0 20px;
        color: white;
        min-width: 90px;
        text-align: center;
      }

      .vs {
        font-size: 14px;
        opacity: 0.5;
        letter-spacing: 2px;
      }

      /* 🔥 CENTER */
      .center {
        background: #050505;
        padding: 6px 20px;
        text-align: center;
        border-left: 2px solid rgba(255,255,255,0.08);
        border-right: 2px solid rgba(255,255,255,0.08);
      }

      #timer {
        font-size: 34px;
        font-weight: 900;
        color: #00ffcc;
        text-shadow: 0 0 12px rgba(0,255,200,0.8);
      }

      .quarter {
        font-size: 12px;
        opacity: 0.6;
        letter-spacing: 2px;
      }

      /* 🔥 SHOT CLOCK FLOAT */
      .shotclock {
        position: absolute;
        right: -65px;
        bottom: 0;

        background: #ff3b30;
        color: white;
        font-size: 28px;
        font-weight: bold;

        width: 60px;
        height: 60px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 12px;
        box-shadow: 0 0 20px rgba(255, 60, 60, 0.8);
      }
    </style>
  </head>

  <body>
    <div class="scoreboard">

      <!-- TEAM A -->
      <div class="team teamA">
        <div class="teamTop">
          <img id="logoA" />
          <span class="teamName" id="teamAName">TEAM A</span>
        </div>
        <div class="foulTeam">
          FOUL <span id="foulA">0</span>
        </div>
      </div>

      <!-- SCORE -->
      <div class="scoreBox">
        <div class="score" id="scoreA">0</div>
        <div class="vs">VS</div>
        <div class="score" id="scoreB">0</div>
      </div>

      <!-- CENTER -->
      <div class="center">
        <div id="timer">10:00</div>
        <div class="quarter" id="quarter">Q1</div>
      </div>

      <!-- TEAM B -->
      <div class="team teamB">
        <div class="teamTop">
          <span class="teamName" id="teamBName">TEAM B</span>
          <img id="logoB" />
        </div>
        <div class="foulTeam">
          FOUL <span id="foulB">0</span>
        </div>
      </div>

      <!-- SHOT CLOCK -->
      <div class="shotclock" id="shotclock">24</div>
    </div>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSy...",
        authDomain: "scoreboard-basket-ea929.firebaseapp.com",
        databaseURL: "https://scoreboard-basket-ea929-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "scoreboard-basket-ea929",
        storageBucket: "scoreboard-basket-ea929.firebasestorage.app",
        messagingSenderId: "248063752824",
        appId: "1:248063752824:web:10eccbc425598daa748b8d",
      };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();

      let currentData = {};

      function formatTime(t) {
        let m = Math.floor(t / 60);
        let s = t % 60;
        return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
      }

      db.ref("scoreboard").on("value", (snapshot) => {
        currentData = snapshot.val() || {};

        scoreA.innerText = currentData.scoreA || 0;
        scoreB.innerText = currentData.scoreB || 0;

        foulA.innerText = currentData.foulA || 0;
        foulB.innerText = currentData.foulB || 0;

        quarter.innerText = "Q" + (currentData.q || 1);

        teamAName.innerText = currentData.teamAName || "TEAM A";
        teamBName.innerText = currentData.teamBName || "TEAM B";

        if (currentData.logoA) logoA.src = currentData.logoA;
        if (currentData.logoB) logoB.src = currentData.logoB;

        if (currentData.colorA)
          document.documentElement.style.setProperty("--teamA", currentData.colorA);

        if (currentData.colorB)
          document.documentElement.style.setProperty("--teamB", currentData.colorB);

        teamAName.style.color = currentData.textColorA || "#ffffff";
        teamBName.style.color = currentData.textColorB || "#ffffff";
      });

      setInterval(() => {
        if (currentData.gameStart) {
          const now = Date.now();
          const elapsed = Math.floor((now - currentData.gameStart) / 1000);
          const remaining = Math.max(0, (currentData.gameDuration || 0) - elapsed);
          timer.innerText = formatTime(remaining);
        } else {
          timer.innerText = formatTime(currentData.time || 0);
        }

        if (currentData.shotStart && currentData.shotOn) {
          const now = Date.now();
          const elapsed = Math.floor((now - currentData.shotStart) / 1000);
          const remaining = Math.max(0, (currentData.shotDuration || 24) - elapsed);

          shotclock.innerText = remaining;
          shotclock.style.display = "flex";
        } else {
          shotclock.innerText = currentData.shot || 24;
          shotclock.style.display = currentData.shotOn ? "flex" : "none";
        }
      }, 200);
    </script>
  </body>
</html>
