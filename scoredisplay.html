<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>NBA Style Scoreboard</title>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <style>
      body {
        margin: 0;
        font-family: 'Segoe UI', Arial;
        background: transparent;
      }

      .scoreboard {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        background: rgba(0,0,0,0.85);
        border-radius: 14px;
        padding: 10px 16px;
        gap: 14px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.5);
      }

      .team {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 160px;
      }

      .team img {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: white;
      }

      .team-info {
        display: flex;
        flex-direction: column;
      }

      .team-name {
        color: white;
        font-weight: bold;
        font-size: 16px;
      }

      .foul {
        color: #bbb;
        font-size: 12px;
      }

      .score {
        font-size: 48px;
        font-weight: bold;
        color: white;
        width: 70px;
        text-align: center;
      }

      .center {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0 12px;
      }

      .timer {
        font-size: 32px;
        font-weight: bold;
        color: #00ffcc;
      }

      .quarter {
        font-size: 14px;
        color: #aaa;
      }

      .shotclock {
        background: #ff3b30;
        color: white;
        font-weight: bold;
        font-size: 24px;
        padding: 8px 12px;
        border-radius: 8px;
        min-width: 50px;
        text-align: center;
      }

      .divider {
        width: 1px;
        height: 50px;
        background: rgba(255,255,255,0.2);
      }
    </style>
  </head>

  <body>
    <div class="scoreboard">

      <div class="team">
        <img id="logoA" />
        <div class="team-info">
          <div class="team-name" id="teamAName">TEAM A</div>
          <div class="foul">FOUL: <span id="foulA">0</span></div>
        </div>
      </div>

      <div class="score" id="scoreA">0</div>

      <div class="divider"></div>

      <div class="center">
        <div class="timer" id="timer">10:00</div>
        <div class="quarter" id="quarter">Q1</div>
      </div>

      <div class="divider"></div>

      <div class="score" id="scoreB">0</div>

      <div class="team">
        <div class="team-info" style="text-align:right">
          <div class="team-name" id="teamBName">TEAM B</div>
          <div class="foul">FOUL: <span id="foulB">0</span></div>
        </div>
        <img id="logoB" />
      </div>

      <div class="shotclock" id="shotclock">24</div>

    </div>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyCTYOFS3I-BpUZwEhHbuvR23AFO_xSvcHw",
        authDomain: "scoreboard-basket-ea929.firebaseapp.com",
        databaseURL:
          "https://scoreboard-basket-ea929-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "scoreboard-basket-ea929",
      };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();

      let currentData = {};

      function formatTime(t) {
        let m = Math.floor(t / 60);
        let s = t % 60;
        return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
      }

      db.ref("scoreboard").on("value", (snapshot) => {
        currentData = snapshot.val() || {};

        scoreA.innerText = currentData.scoreA || 0;
        scoreB.innerText = currentData.scoreB || 0;

        foulA.innerText = currentData.foulA || 0;
        foulB.innerText = currentData.foulB || 0;

        quarter.innerText = "Q" + (currentData.q || 1);

        teamAName.innerText = currentData.teamAName || "TEAM A";
        teamBName.innerText = currentData.teamBName || "TEAM B";

        if (currentData.logoA) logoA.src = currentData.logoA;
        if (currentData.logoB) logoB.src = currentData.logoB;
      });

      setInterval(() => {
        if (currentData.gameStart) {
          const now = Date.now();
          const elapsed = Math.floor((now - currentData.gameStart) / 1000);
          const remaining = Math.max(
            0,
            (currentData.gameDuration || 0) - elapsed,
          );

          timer.innerText = formatTime(remaining);
        } else {
          timer.innerText = formatTime(currentData.time || 0);
        }

        if (currentData.shotStart && currentData.shotOn) {
          const now = Date.now();
          const elapsed = Math.floor((now - currentData.shotStart) / 1000);
          const remaining = Math.max(
            0,
            (currentData.shotDuration || 24) - elapsed,
          );

          shotclock.innerText = remaining;
          shotclock.style.display = "block";
        } else {
          shotclock.innerText = currentData.shot || 24;
          shotclock.style.display = currentData.shotOn ? "block" : "none";
        }
      }, 200);
    </script>
  </body>
</html>
