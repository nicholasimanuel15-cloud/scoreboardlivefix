<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Scoreboard Display</title>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <style>
      body {
        margin: 0;
        background: transparent;
        font-family: "Arial Black", Arial, sans-serif;
      }

      :root {
        --teamA: #c8102e;
        --teamB: #1d428a;
      }

      #matchTitle {
        position: absolute;
        bottom: 110px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.85);
        color: #fff;
        padding: 6px 20px;
        border-radius: 8px;
        font-size: 18px;
        font-weight: bold;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      .scoreboard {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        background: rgba(0, 0, 0, 0.9);
        border-radius: 10px;
        overflow: hidden;
      }

      .team {
        padding: 10px 16px;
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-width: 200px;
      }

      .teamTop {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .team img {
        width: 40px;
        height: 40px;
      }

      .team span {
        font-size: 18px;
        font-weight: bold;
      }

      .score {
        background: #111;
        color: white;
        font-size: 52px;
        font-weight: 900;
        padding: 10px 20px;
      }

      .center {
        background: #000;
        color: #fff;
        text-align: center;
        padding: 6px 16px;
      }

      #timer {
        font-size: 30px;
        font-weight: 900;
        color: #00ffcc;
      }

      .shotclock {
        background: #ff3b30;
        color: white;
        font-size: 30px;
        font-weight: bold;
        min-width: 55px;
        display: none; /* 🔥 default hilang */
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>

  <body>

    <div id="matchTitle">MATCH</div>

    <div class="scoreboard">

      <div class="team teamA">
        <div class="teamTop">
          <img id="logoA" />
          <span id="teamAName">TEAM A</span>
        </div>
        <div>FOUL <span id="foulA">0</span></div>
      </div>

      <div class="score" id="scoreA">0</div>

      <div class="center">
        <div id="timer">10:00</div>
        <div id="quarter">Q1</div>
      </div>

      <div class="score" id="scoreB">0</div>

      <div class="team teamB">
        <div class="teamTop">
          <span id="teamBName">TEAM B</span>
          <img id="logoB" />
        </div>
        <div>FOUL <span id="foulB">0</span></div>
      </div>

      <div class="shotclock" id="shotclock">24</div>
    </div>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyCTYOFS3I-BpUZwEhHbuvR23AFO_xSvcHw",
        authDomain: "scoreboard-basket-ea929.firebaseapp.com",
        databaseURL: "https://scoreboard-basket-ea929-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "scoreboard-basket-ea929",
        storageBucket: "scoreboard-basket-ea929.firebasestorage.app",
        messagingSenderId: "248063752824",
        appId: "1:248063752824:web:10eccbc425598daa748b8d",
      };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();

      let currentData = {};

      function formatTime(t) {
        let m = Math.floor(t / 60);
        let s = t % 60;
        return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
      }

      db.ref("scoreboard").on("value", (snapshot) => {
        currentData = snapshot.val() || {};

        scoreA.innerText = currentData.scoreA || 0;
        scoreB.innerText = currentData.scoreB || 0;

        foulA.innerText = currentData.foulA || 0;
        foulB.innerText = currentData.foulB || 0;

        quarter.innerText = "Q" + (currentData.q || 1);

        teamAName.innerText = currentData.teamAName || "TEAM A";
        teamBName.innerText = currentData.teamBName || "TEAM B";

        matchTitle.innerText = currentData.matchTitle || "MATCH";

        if (currentData.logoA) logoA.src = currentData.logoA;
        if (currentData.logoB) logoB.src = currentData.logoB;
      });

      setInterval(() => {

        // TIMER
        if (currentData.gameStart) {
          const now = Date.now();
          const elapsed = Math.floor((now - currentData.gameStart) / 1000);
          const remaining = Math.max(0, (currentData.gameDuration || 0) - elapsed);
          timer.innerText = formatTime(remaining);
        } else {
          timer.innerText = formatTime(currentData.time || 0);
        }

        // 🔥 SHOT CLOCK TOGGLE
        if (currentData.shotOn) {

          shotclock.style.display = "flex";

          if (currentData.shotStart) {
            const now = Date.now();
            const elapsed = Math.floor((now - currentData.shotStart) / 1000);
            const remaining = Math.max(0, (currentData.shotDuration || 24) - elapsed);
            shotclock.innerText = remaining;
          } else {
            shotclock.innerText = currentData.shot || 24;
          }

        } else {
          shotclock.style.display = "none";
        }

      }, 200);
    </script>
  </body>
</html>
