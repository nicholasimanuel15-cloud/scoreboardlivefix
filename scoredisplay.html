<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Scoreboard Display</title>

    <!-- 🔥 FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <style>
      body {
        margin: 0;
        background: transparent;
        font-family: "Arial Black", Arial, sans-serif;
      }

      :root {
        --teamA: #c8102e;
        --teamB: #1d428a;
      }

      /* 🔥 MAIN SCOREBOARD */
      .scoreboard {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(10px);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
      }

      /* 🔥 TEAM BLOCK */
      .team {
        padding: 10px 18px;
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-width: 140px;
      }

      .teamTop {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .team img {
        width: 28px;
        height: 28px;
      }

      .team span {
        font-size: 14px;
        letter-spacing: 1px;
      }

      .foul {
        font-size: 12px;
        opacity: 0.8;
      }

      .teamA {
        background: linear-gradient(135deg, var(--teamA), #000);
      }

      .teamB {
        background: linear-gradient(135deg, #000, var(--teamB));
      }

      /* 🔥 SCORE */
      .score {
        background: #111;
        color: white;
        font-size: 46px;
        padding: 10px 18px;
        font-weight: bold;
        text-align: center;
        min-width: 70px;
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
      }

      /* 🔥 CENTER TIMER */
      .center {
        background: #000;
        color: #fff;
        text-align: center;
        padding: 8px 14px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      #timer {
        font-size: 28px;
        font-weight: bold;
        color: #00ffcc;
        text-shadow: 0 0 10px rgba(0, 255, 200, 0.7);
      }

      .quarter {
        font-size: 12px;
        opacity: 0.7;
      }

      /* 🔥 SHOT CLOCK */
      .shotclock {
        background: #ff3b30;
        color: white;
        font-size: 28px;
        padding: 12px;
        font-weight: bold;
        min-width: 50px;
        text-align: center;
        box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.6);
      }
    </style>
  </head>

  <body>
    <div class="scoreboard">
      <!-- TEAM A -->
      <div class="team teamA">
        <div class="teamTop">
          <img id="logoA" />
          <span id="teamAName">TEAM A</span>
        </div>
        <div class="foul">FOUL: <span id="foulA">0</span></div>
      </div>

      <div class="score" id="scoreA">0</div>

      <!-- CENTER -->
      <div class="center">
        <div id="timer">10:00</div>
        <div class="quarter" id="quarter">Q1</div>
      </div>

      <div class="score" id="scoreB">0</div>

      <!-- TEAM B -->
      <div class="team teamB">
        <div class="teamTop">
          <span id="teamBName">TEAM B</span>
          <img id="logoB" />
        </div>
        <div class="foul">FOUL: <span id="foulB">0</span></div>
      </div>

      <div class="shotclock" id="shotclock">24</div>
    </div>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyCTYOFS3I-BpUZwEhHbuvR23AFO_xSvcHw",
        authDomain: "scoreboard-basket-ea929.firebaseapp.com",
        databaseURL:
          "https://scoreboard-basket-ea929-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "scoreboard-basket-ea929",
        storageBucket: "scoreboard-basket-ea929.firebasestorage.app",
        messagingSenderId: "248063752824",
        appId: "1:248063752824:web:10eccbc425598daa748b8d",
      };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();

      let currentData = {};

      function formatTime(t) {
        let m = Math.floor(t / 60);
        let s = t % 60;
        return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
      }

      // 🔥 REALTIME LISTENER
      db.ref("scoreboard").on("value", (snapshot) => {
        currentData = snapshot.val() || {};

        scoreA.innerText = currentData.scoreA || 0;
        scoreB.innerText = currentData.scoreB || 0;

        foulA.innerText = currentData.foulA || 0;
        foulB.innerText = currentData.foulB || 0;

        quarter.innerText = "Q" + (currentData.q || 1);

        teamAName.innerText = currentData.teamAName || "TEAM A";
        teamBName.innerText = currentData.teamBName || "TEAM B";

        if (currentData.logoA) logoA.src = currentData.logoA;
        if (currentData.logoB) logoB.src = currentData.logoB;

        if (currentData.colorA)
          document.documentElement.style.setProperty(
            "--teamA",
            currentData.colorA
          );

        if (currentData.colorB)
          document.documentElement.style.setProperty(
            "--teamB",
            currentData.colorB
          );

        teamAName.style.color = currentData.textColorA || "#ffffff";
        teamBName.style.color = currentData.textColorB || "#ffffff";
      });

      // 🔥 SMOOTH TIMER LOOP
      setInterval(() => {
        // GAME TIMER
        if (currentData.gameStart) {
          const now = Date.now();
          const elapsed = Math.floor(
            (now - currentData.gameStart) / 1000
          );
          const remaining = Math.max(
            0,
            (currentData.gameDuration || 0) - elapsed
          );

          timer.innerText = formatTime(remaining);
        } else {
          timer.innerText = formatTime(currentData.time || 0);
        }

        // SHOT CLOCK
        if (currentData.shotStart && currentData.shotOn) {
          const now = Date.now();
          const elapsed = Math.floor(
            (now - currentData.shotStart) / 1000
          );
          const remaining = Math.max(
            0,
            (currentData.shotDuration || 24) - elapsed
          );

          shotclock.innerText = remaining;
          shotclock.style.display = "block";
        } else {
          shotclock.innerText = currentData.shot || 24;
          shotclock.style.display = currentData.shotOn ? "block" : "none";
        }
      }, 200);
    </script>
  </body>
</html>
