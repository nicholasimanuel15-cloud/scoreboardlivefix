<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Scoreboard IBL Style</title>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <style>
      body {
        margin: 0;
        background: transparent;
        font-family: Arial, sans-serif;
      }

      /* 🔥 MAIN BAR */
      .scoreboard {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        background: linear-gradient(90deg, #0a2a66, #0f3c9c);
        color: white;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 6px 20px rgba(0,0,0,0.5);
      }

      .left {
        padding: 6px 12px;
        font-size: 12px;
        background: rgba(255,255,255,0.1);
      }

      /* 🔥 TEAM BLOCK */
      .team {
        display: flex;
        flex-direction: column;
        padding: 6px 12px;
        min-width: 140px;
      }

      .teamTop {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 16px;
        font-weight: bold;
      }

      .team img {
        width: 22px;
        height: 22px;
      }

      /* 🔥 FOUL DI BAWAH */
      .foul {
        font-size: 10px;
        opacity: 0.8;
        margin-top: 2px;
      }

      .teamA {
        align-items: flex-start;
      }

      .teamB {
        align-items: flex-end;
        text-align: right;
      }

      /* 🔥 VS */
      .vs {
        font-size: 18px;
        font-weight: bold;
        padding: 0 10px;
      }

      /* 🔥 SCORE (optional tetap ada kalau mau dipakai nanti) */
      .score {
        font-size: 24px;
        font-weight: bold;
        padding: 0 6px;
      }

      /* 🔥 CENTER INFO */
      .center {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 12px;
        font-size: 14px;
        background: rgba(0,0,0,0.25);
      }

      .quarter {
        font-weight: bold;
      }

      .timer {
        font-weight: bold;
      }

      /* 🔥 SHOTCLOCK */
      .shotclock {
        background: #1e90ff;
        padding: 6px 12px;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <div class="scoreboard">

      <!-- LEFT -->
      <div class="left">GROUP PHASE</div>

      <!-- TEAM A -->
      <div class="team teamA">
        <div class="teamTop">
          <img id="logoA" />
          <span id="teamAName">AAA</span>
        </div>
        <div class="foul">F <span id="foulA">0</span></div>
      </div>

      <!-- VS -->
      <div class="vs">VS</div>

      <!-- TEAM B -->
      <div class="team teamB">
        <div class="teamTop">
          <span id="teamBName">BBB</span>
          <img id="logoB" />
        </div>
        <div class="foul">F <span id="foulB">0</span></div>
      </div>

      <!-- CENTER INFO -->
      <div class="center">
        <span class="quarter" id="quarter">Q1</span>
        <span class="timer" id="timer">01:00</span>
      </div>

      <!-- SHOTCLOCK -->
      <div class="shotclock" id="shotclock">20</div>
    </div>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyCTYOFS3I-BpUZwEhHbuvR23AFO_xSvcHw",
        authDomain: "scoreboard-basket-ea929.firebaseapp.com",
        databaseURL:
          "https://scoreboard-basket-ea929-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "scoreboard-basket-ea929",
        storageBucket: "scoreboard-basket-ea929.firebasestorage.app",
        messagingSenderId: "248063752824",
        appId: "1:248063752824:web:10eccbc425598daa748b8d",
      };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();

      let currentData = {};

      function formatTime(t) {
        let m = Math.floor(t / 60);
        let s = t % 60;
        return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
      }

      db.ref("scoreboard").on("value", (snapshot) => {
        currentData = snapshot.val() || {};

        foulA.innerText = currentData.foulA || 0;
        foulB.innerText = currentData.foulB || 0;

        quarter.innerText = "Q" + (currentData.q || 1);

        teamAName.innerText = currentData.teamAName || "AAA";
        teamBName.innerText = currentData.teamBName || "BBB";

        if (currentData.logoA) logoA.src = currentData.logoA;
        if (currentData.logoB) logoB.src = currentData.logoB;
      });

      setInterval(() => {
        if (currentData.gameStart) {
          const now = Date.now();
          const elapsed = Math.floor((now - currentData.gameStart) / 1000);
          const remaining = Math.max(0, (currentData.gameDuration || 0) - elapsed);
          timer.innerText = formatTime(remaining);
        } else {
          timer.innerText = formatTime(currentData.time || 0);
        }

        if (currentData.shotStart && currentData.shotOn) {
          const now = Date.now();
          const elapsed = Math.floor((now - currentData.shotStart) / 1000);
          const remaining = Math.max(0, (currentData.shotDuration || 24) - elapsed);

          shotclock.innerText = remaining;
        } else {
          shotclock.innerText = currentData.shot || 24;
        }
      }, 200);
    </script>
  </body>
</html>
