<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Scoreboard Display</title>

    <!-- 🔥 FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <style>
      body {
        margin: 0;
        background: transparent;
        font-family: "Arial Black", Arial, sans-serif;
      }

      :root {
        --teamA: #c8102e;
        --teamB: #1d428a;
      }

      .scoreboard {
        position: absolute;
        top: 30px; /* 🔥 pindah ke atas */
        left: 50%;

        transform: translateX(-50%) scale(0.65);
        transform-origin: top center; /* 🔥 anchor ke atas */

        display: flex;
        align-items: stretch;

        background: rgba(0, 0, 0, 0.9);
        border-radius: 10px;
        overflow: hidden;
      }

      /* 🔥 MATCH TITLE */
      .matchTitle {
        background: #2f2f2f;
        color: #fff;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 12px 18px;      /* 🔥 sedikit lebih besar */
        font-size: 18px;         /* 🔥 BESARKAN */
        font-weight: bold;
        letter-spacing: 1.5px;

        border-right: 2px solid rgba(255,255,255,0.1);

        text-align: center;
        line-height: 1.1;
        min-width: 130px;        /* 🔥 biar nggak sempit */

        text-shadow: 0 1px 3px rgba(0,0,0,0.6);
      }

      .team {
        padding: 10px 16px;
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-width: 200px;

        box-shadow: none;
        background-image: none;
      }

      .teamTop {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
      }

      .teamA .teamTop {
        justify-content: flex-start;
      }

      .teamB .teamTop {
        justify-content: flex-end;
      }

      .team img {
        width: 60px; /* 🔥 lebih besar */
        height: 60px;
        object-fit: contain;

        background: #111; /* 🔥 background gelap */
        padding: 6px;

        border-radius: 50%; /* 🔥 bulat */
        border: 3px solid white; /* 🔥 ring putih khas NBA */

        box-shadow:
          0 0 6px rgba(0, 0, 0, 0.6),
          /* outer shadow */ inset 0 0 6px rgba(255, 255, 255, 0.2); /* inner glow */
      }

      .teamTop {
        display: flex;
        align-items: center;
        width: 100%;
      }

      .team span {
        font-size: 18px;
        font-weight: bold;
        letter-spacing: 1px;
        flex: 1;
        text-align: center; /* 🔥 ini yang bikin teks ke tengah */
      }

      .foulTeam {
        margin-top: 4px;
        font-size: 11px;
        opacity: 0.8;
      }

      .teamA .foulTeam,
      .teamB .foulTeam {
        text-align: center;
        border-top: 4px solid rgba(255, 255, 255, 0.7);
        margin-top: 6px;
        padding-top: 6px;
      }

      .teamA {
        background: var(--teamA);
      }

      .teamB {
        background: var(--teamB);
      }

      .score {
        background: #111;
        color: white;
        font-size: 52px;
        font-weight: 900;
        text-align: center;

        padding: 10px 20px;
        min-width: 80px;

        border-left: 2px solid rgba(255, 255, 255, 0.1);
        border-right: 2px solid rgba(255, 255, 255, 0.1);
      }

      .center {
        background: #000;
        color: #fff;

        display: flex;
        flex-direction: column;
        justify-content: center;
        text-align: center;

        padding: 6px 16px;

        border-left: 2px solid rgba(255, 255, 255, 0.1);
        border-right: 2px solid rgba(255, 255, 255, 0.1);
      }

      #timer {
        font-size: 30px;
        font-weight: 900;

        color: #ffd700; /* emas */
      }

      .quarter {
        font-size: 11px;
        margin-top: 2px;
        opacity: 0.7;
        letter-spacing: 1px;
      }

      .shotclock {
        background: linear-gradient(180deg, #FFD700, #c9a400);
        color: #000;

        font-size: 25px;        /* 🔥 samakan feel dengan title */
        font-weight: bold;

        min-width: 110px;       /* 🔥 biar proporsional */
        padding: 12px 18px;     /* 🔥 SAMA dengan matchTitle */

        display: flex;
        align-items: center;
        justify-content: center;

        text-shadow: 0 1px 2px rgba(255,255,255,0.3);
      }
      /* 🔥 NBA STYLE LOGO */
      .logoWrap {
        width: 50px;
        height: 50px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 50%;

        /* 🔥 background depth */
        background: radial-gradient(circle at 30% 30%, #2a2a2a, #000);

        /* 🔥 ring putih khas NBA */
        border: 3px solid white;

        /* 🔥 shadow + inner glow */
        box-shadow:
        0 6px 14px rgba(0,0,0,0.8),
        inset 0 0 10px rgba(255,255,255,0.2);
      }

        /* 🔥 ukuran logo di dalam */
      .logoWrap img {
        width: 75%;
        height: 75%;
        object-fit: contain;
      }
    </style>
  </head>

  <body>
    <div class="scoreboard">
      <!-- 🔥 MATCH TITLE -->
      <div class="matchTitle" id="matchTitle">GROUP<br />PHASE</div>

      <!-- 🔴 TEAM A -->
      <div class="team teamA">
        <div class="teamTop">
          <div class="logoWrap">
              <img id="logoA" />
          </div>
          <span id="teamAName">TEAM A</span>
        </div>
        <div class="foulTeam">FOUL <span id="foulA">0</span></div>
      </div>

      <!-- 🔢 SCORE A -->
      <div class="score" id="scoreA">0</div>

      <!-- ⏱ CENTER -->
      <div class="center">
        <div id="timer">10:00</div>
        <div class="quarter" id="quarter">Q1</div>
      </div>

      <!-- 🔢 SCORE B -->
      <div class="score" id="scoreB">0</div>

      <!-- 🔵 TEAM B -->
      <div class="team teamB">
        <div class="teamTop">
          <span id="teamBName">TEAM B</span>
          <div class="logoWrap">
            <img id="logoB" />
          </div>
        </div>
        <div class="foulTeam">FOUL <span id="foulB">0</span></div>
      </div>

      <!-- ⏱ SHOT CLOCK -->
      <div class="shotclock" id="shotclock">24</div>
    </div>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSy...",
        authDomain: "scoreboard-basket-ea929.firebaseapp.com",
        databaseURL:
          "https://scoreboard-basket-ea929-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "scoreboard-basket-ea929",
        storageBucket: "scoreboard-basket-ea929.firebasestorage.app",
        messagingSenderId: "248063752824",
        appId: "1:248063752824:web:10eccbc425598daa748b8d",
      };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();

      let currentData = {};

      function formatTime(t) {
        let m = Math.floor(t / 60);
        let s = t % 60;
        return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
      }

      db.ref("scoreboard").on("value", (snapshot) => {
        currentData = snapshot.val() || {};

        // 🔥 UPDATE FOUL COLOR DI SINI
        document.querySelector(".teamA .foulTeam").style.color =
          currentData.textColorA || "#ffffff";

        document.querySelector(".teamB .foulTeam").style.color =
          currentData.textColorB || "#ffffff";

        // 🔥 AUTO 2 BARIS
        let title = currentData.matchTitle || "GROUP PHASE";
        matchTitle.innerHTML = title.replace(" ", "<br>");

        scoreA.innerText = currentData.scoreA || 0;
        scoreB.innerText = currentData.scoreB || 0;

        foulA.innerText = currentData.foulA || 0;
        foulB.innerText = currentData.foulB || 0;

        quarter.innerText = "Q" + (currentData.q || 1);

        teamAName.innerText = currentData.teamAName || "TEAM A";
        teamBName.innerText = currentData.teamBName || "TEAM B";

        if (currentData.logoA) logoA.src = currentData.logoA;
        if (currentData.logoB) logoB.src = currentData.logoB;

        if (currentData.colorA)
          document.documentElement.style.setProperty(
            "--teamA",
            currentData.colorA,
          );

        if (currentData.colorB)
          document.documentElement.style.setProperty(
            "--teamB",
            currentData.colorB,
          );

        teamAName.style.color = currentData.textColorA || "#ffffff";
        teamBName.style.color = currentData.textColorB || "#ffffff";
      });

      setInterval(() => {
        if (currentData.gameStart) {
          const now = Date.now();
          const elapsed = Math.floor((now - currentData.gameStart) / 1000);
          const remaining = Math.max(
            0,
            (currentData.gameDuration || 0) - elapsed,
          );
          timer.innerText = formatTime(remaining);
        } else {
          timer.innerText = formatTime(currentData.time || 0);
        }

        if (currentData.shotStart && currentData.shotOn) {
          const now = Date.now();
          const elapsed = Math.floor((now - currentData.shotStart) / 1000);
          const remaining = Math.max(
            0,
            (currentData.shotDuration || 24) - elapsed,
          );

          shotclock.innerText = remaining;
          shotclock.style.display = "flex";
        } else {
          shotclock.innerText = currentData.shot || 24;
          shotclock.style.display = currentData.shotOn ? "flex" : "none";
        }
      }, 200);
    </script>
  </body>
</html>
